upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

# Limitation de débit : durcie sur l'authentification.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=30r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hub.wagadu.africa localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # ─── En-têtes de sécurité ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-src 'self' https://meet.wagadu.africa https://chat.wagadu.africa" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ─── API Django ────────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /django-admin/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # ─── Services intégrés (phase 5) ───────────────────────────────
    # location /chat/ { proxy_pass http://rocketchat:3000/; ... }
    # location /meet/ { proxy_pass http://jitsi-web:80/; ... }

    # ─── Frontend Next.js (PWA) ────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}

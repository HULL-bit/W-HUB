# Surcharge de développement local : hot-reload, ports exposés, settings dev.
# Chargée automatiquement par `docker compose` en plus de docker-compose.yml.
#
#   cd infra && cp .env.example .env      # (déjà fait ? sinon, le faire)
#   docker compose up -d --build
#   docker compose exec backend python manage.py createsuperadmin
#
# Front : http://localhost:3000   API : http://localhost:8000/api/v1
# (Nginx sur http://localhost sert aussi l'ensemble.)
services:
  # Nginx en HTTP simple pour le dev (la config prod exige des certificats TLS).
  nginx:
    volumes:
      - ./nginx/dev:/etc/nginx/conf.d:ro

  backend:
    build: ../backend
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.dev
      USE_SQLITE: "0"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    entrypoint: []
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ../frontend
    environment:
      NODE_ENV: development
      # Chemin relatif : fonctionne via Nginx (http://localhost) ET via le
      # rewrite Next (http://localhost:3000, proxifié vers INTERNAL_API_URL).
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      INTERNAL_API_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    entrypoint: []
    # npm ci : n'altère jamais package-lock.json (contrairement à npm install)
    command: sh -c "npm ci --prefer-offline --no-audit || npm install --no-save; npm run dev"
    ports:
      - "3000:3000"

  celery-worker:
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.dev
      USE_SQLITE: "0"
    volumes:
      - ../backend:/app

  celery-beat:
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.dev
      USE_SQLITE: "0"
    volumes:
      - ../backend:/app
    # laisse le backend appliquer les migrations avant de démarrer le scheduler
    command: >
      sh -c "sleep 12 &&
             celery -A wagadu beat -l info
             --scheduler django_celery_beat.schedulers:DatabaseScheduler"

name: wagadu-hub

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - backend_static:/var/www/static:ro
    depends_on:
      - backend
      - frontend

  backend:
    image: ${REGISTRY:-ghcr.io/hull-bit}/wagadu-hub-backend:${IMAGE_TAG:-latest}
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.prod
    volumes:
      - backend_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    image: ${REGISTRY:-ghcr.io/hull-bit}/wagadu-hub-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    env_file: .env
    command: node server.js
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # File d'attente Celery : notifications, rappels d'échéance, e-mails,
    # génération de PDF, purge du journal d'audit.

  celery-worker:
    image: ${REGISTRY:-ghcr.io/hull-bit}/wagadu-hub-backend:${IMAGE_TAG:-latest}
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.prod
    entrypoint: []
    command: celery -A wagadu worker -l info
    depends_on:
      - backend
      - redis

  celery-beat:
    image: ${REGISTRY:-ghcr.io/hull-bit}/wagadu-hub-backend:${IMAGE_TAG:-latest}
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.prod
    entrypoint: []
    command: celery -A wagadu beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - backend
      - redis

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Création du bucket au premier démarrage (one-shot).
  minio-setup:
    image: minio/mc
    restart: "no"
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/\"$${MINIO_BUCKET}\" &&
      mc anonymous set download local/\"$${MINIO_BUCKET}\" || true
      "

  # ─── Messagerie Rocket.Chat (profil « chat ») ───────────────────────────
  #   docker compose --profile chat up -d
  # Les variables ROCKETCHAT_* de .env sont déjà renseignées pour le dev.
  # Premier démarrage : ~90 s (téléchargement image + boot). Admin auto-créé.
  mongodb:
    image: mongo:6
    profiles: ["chat"]
    restart: unless-stopped
    command: mongod --replSet rs0 --oplogSize 128
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  mongo-init:
    image: mongo:6
    profiles: ["chat"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "-c", "mongosh --host mongodb --quiet --eval 'try{rs.status().ok}catch(e){rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]})}'"]

  rocketchat:
    image: rocketchat/rocket.chat:6.13.0
    profiles: ["chat"]
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://mongodb:27017/local?replicaSet=rs0
      ROOT_URL: ${ROCKETCHAT_URL:-http://localhost:3100}
      PORT: "3000"
      DEPLOY_METHOD: docker
      # Admin provisionné au 1er démarrage (évite l'assistant de configuration)
      ADMIN_USERNAME: ${ROCKETCHAT_ADMIN_USER:-wagadu-admin}
      ADMIN_PASS: ${ROCKETCHAT_ADMIN_PASSWORD:-Wagadu2026!Chat}
      ADMIN_EMAIL: ${ROCKETCHAT_ADMIN_EMAIL:-chat-admin@wagadu.africa}
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      # Intégration iframe (SSO login-with-token depuis le hub)
      OVERWRITE_SETTING_Iframe_Restrict_Access: "false"
      OVERWRITE_SETTING_Iframe_Integration_send_enable: "true"
      OVERWRITE_SETTING_Iframe_Integration_receive_enable: "true"
      OVERWRITE_SETTING_API_Enable_CORS: "true"
      OVERWRITE_SETTING_API_CORS_Origin: "*"
      OVERWRITE_SETTING_Accounts_iframe_enabled: "false"
      OVERWRITE_SETTING_Accounts_AllowUserProfileChange: "true"
      OVERWRITE_SETTING_FileUpload_Storage_Type: GridFS
      # SSO serveur→serveur : pas de 2FA e-mail sur le login API
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_Enabled: "false"
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_By_Email_Enabled: "false"
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_By_TOTP_Enabled: "false"
      OVERWRITE_SETTING_Accounts_RegistrationForm: disabled
      OVERWRITE_SETTING_Accounts_PasswordReset: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "${ROCKETCHAT_HOST_PORT:-3100}:3000"

  # Jitsi : instance déjà hébergée (JITSI_URL). Pour le self-hoster, ajouter ici
  # les services jitsi/web, prosody, jicofo, jvb (images officielles jitsi/*).

volumes:
  pgdata:
  miniodata:
  mongodata:
  backend_static:

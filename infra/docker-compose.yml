name: wagadu-hub

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - backend_static:/var/www/static:ro
    depends_on:
      - backend
      - frontend

  backend:
    image: ${REGISTRY:-ghcr.io/hull-bit}/wagadu-hub-backend:${IMAGE_TAG:-latest}
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.prod
    volumes:
      - backend_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    image: ${REGISTRY:-ghcr.io/hull-bit}/wagadu-hub-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    env_file: .env
    command: node server.js
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # File d'attente Celery : notifications, rappels d'échéance, e-mails,
    # génération de PDF, purge du journal d'audit.

  celery-worker:
    image: ${REGISTRY:-ghcr.io/hull-bit}/wagadu-hub-backend:${IMAGE_TAG:-latest}
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.prod
    entrypoint: []
    command: celery -A wagadu worker -l info
    depends_on:
      - backend
      - redis

  celery-beat:
    image: ${REGISTRY:-ghcr.io/hull-bit}/wagadu-hub-backend:${IMAGE_TAG:-latest}
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.prod
    entrypoint: []
    command: celery -A wagadu beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - backend
      - redis

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Création du bucket au premier démarrage (one-shot).
  minio-setup:
    image: minio/mc
    restart: "no"
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/\"$${MINIO_BUCKET}\" &&
      mc anonymous set download local/\"$${MINIO_BUCKET}\" || true
      "

  # ─── Messagerie Rocket.Chat (profil « chat » — non démarré par défaut) ───
  # docker compose --profile chat up -d
  # Puis renseigner ROCKETCHAT_URL / ROCKETCHAT_ADMIN_* dans .env.
  mongodb:
    image: mongo:6
    profiles: ["chat"]
    restart: unless-stopped
    command: mongod --replSet rs0 --oplogSize 128
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  mongo-init:
    image: mongo:6
    profiles: ["chat"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "-c", "mongosh --host mongodb --eval 'try{rs.status()}catch(e){rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]})}'"]

  rocketchat:
    image: rocketchat/rocket.chat:6.13.0
    profiles: ["chat"]
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://mongodb:27017/local?replicaSet=rs0
      ROOT_URL: ${ROCKETCHAT_URL:-http://localhost:3000}
      PORT: "3000"
    depends_on:
      - mongo-init
    ports:
      - "3000:3000"

  # Jitsi : instance déjà hébergée (JITSI_URL). Pour le self-hoster, ajouter ici
  # les services jitsi/web, prosody, jicofo, jvb (images officielles jitsi/*).

volumes:
  pgdata:
  miniodata:
  mongodata:
  backend_static:

name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push des images
        run: |
          TAG=${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          docker build -t ghcr.io/${{ github.repository }}-backend:$TAG ./backend
          docker build -t ghcr.io/${{ github.repository }}-frontend:$TAG \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1 ./frontend
          docker push ghcr.io/${{ github.repository }}-backend:$TAG
          docker push ghcr.io/${{ github.repository }}-frontend:$TAG

      - name: Déploiement SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            docker compose -f infra/docker-compose.yml pull
            docker compose -f infra/docker-compose.yml up -d
            docker compose -f infra/docker-compose.yml exec -T backend python manage.py migrate --noinput

      - name: Notification de déploiement
        if: always()
        run: |
          echo "Déploiement ${{ job.status }} sur ${{ github.ref_name }}"
          # curl -X POST "$ROCKETCHAT_WEBHOOK" -d "{\"text\": \"Déploiement ${{ job.status }}\"}"
